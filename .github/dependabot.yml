# Dependabot only proposes updates as pull requests on dependabot/* branches.
# It never merges, tags, publishes or deploys; each proposal is merged only
# after the owner's review (see RELEASE_POLICY.md). Playwright updates touch
# the Firefox navigation-race workaround, so review them rather than merging
# them automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: []
    commit-message:
      prefix: chore(deps)
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns:
          - '*'
