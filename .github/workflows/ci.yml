name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Core and workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Audit locked test dependencies
        run: npm audit --audit-level=high
      - name: Verify released research core
        run: |
          python -B tools/verify_release.py
          python -B -m unittest discover -s tests -v
      - name: Validate and build workbench
        run: npm run check
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Browser and accessibility checks
        run: npm run test:browser
      - name: Check whitespace
        run: |
          git show --format= --check HEAD
          git diff --check
