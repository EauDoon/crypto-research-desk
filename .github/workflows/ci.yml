name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push to main deploys production, so each main commit keeps its own
# uncancelled verdict. Pull request pushes still supersede each other.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-build:
    name: Production dependency boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install production dependencies exactly as Vercel does
        run: npm ci --ignore-scripts --omit=dev
      - name: Build verified production artifact
        run: npm run build

  quality:
    name: Core and workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Audit locked test dependencies
        run: npm audit --audit-level=high
      - name: Verify released research core
        run: |
          python -B tools/verify_release.py
          python -B -m unittest discover -s tests -v
      - name: Validate and build workbench
        run: npm run check
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Browser and accessibility checks
        run: npm run test:browser
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check whitespace
        run: |
          git hash-object -w -t tree /dev/null >/dev/null
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          git show --format= --check HEAD
